<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local AI Chat</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f4f6; color: #111827; font: 15px Arial, sans-serif; }
    .app { width: min(100%, 920px); height: 100vh; margin: auto; display: flex; flex-direction: column; background: #fff; }
    .header { display: flex; align-items: center; gap: 12px; padding: 14px 20px; color: #fff; background: #2563eb; }
    .avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: #dbeafe; color: #1d4ed8; font-weight: 700; }
    .header h1 { margin: 0; font-size: 17px; }
    .status { margin-top: 3px; color: #bfdbfe; font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: end; padding: 10px 18px; border-bottom: 1px solid #e5e7eb; background: #f8fafc; }
    .toolbar label { display: flex; flex-direction: column; gap: 4px; color: #334155; font-size: 12px; }
    .toolbar select { min-width: 180px; padding: 7px 10px; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; font: inherit; color: #111827; }
    .toolbar [hidden] { display: none; }
    .toolbar .check { align-self: center; }
    .toolbar .check span { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #111827; cursor: pointer; }
    .toolbar .hint { margin-left: auto; color: #64748b; font-size: 12px; align-self: center; }
    .messages { flex: 1; overflow-y: auto; padding: 24px clamp(14px, 5vw, 56px); background: #f9fafb; }
    .message { display: flex; margin: 0 0 18px; }
    .message.user { justify-content: flex-end; }
    .col { max-width: min(78%, 620px); display: flex; flex-direction: column; gap: 8px; }
    .bubble { padding: 10px 14px; border-radius: 16px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .assistant .bubble { border-bottom-left-radius: 4px; background: #e5e7eb; }
    .user .bubble { border-bottom-right-radius: 4px; background: #2563eb; color: #fff; }
    .system { justify-content: center; color: #6b7280; font-size: 13px; }
    .system .bubble { padding: 0; background: transparent; }
    .error .bubble { background: #fee2e2; color: #b91c1c; }
    .sources { padding: 8px 12px; border: 1px solid #dbe3ee; border-radius: 12px; background: #fff; color: #1f2937; font-size: 13px; line-height: 1.4; }
    .sources summary { cursor: pointer; color: #1e3a8a; font-size: 13px; font-weight: 600; }
    .sources ul { margin: 8px 0 0; padding-left: 0; }
    .sources li { margin: 0 0 6px; list-style: none; }
    .sources .muted { color: #64748b; }
    .sources .source-item { margin: 0; }
    .sources .source-item summary { font-weight: 500; color: #1f2937; }
    .sources .source-full { margin: 6px 0 0; white-space: pre-wrap; }
    .caption { font-size: 11px; color: #888; line-height: 1.3; }
    .composer { display: flex; gap: 10px; padding: 14px 18px; border-top: 1px solid #e5e7eb; background: #fff; }
    #message { flex: 1; min-width: 0; padding: 12px 15px; border: 1px solid #d1d5db; border-radius: 22px; outline: none; font: inherit; }
    #message:focus { border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
    button[type="submit"] { width: 44px; height: 44px; border: 0; border-radius: 50%; background: #2563eb; color: #fff; cursor: pointer; font-size: 19px; }
    button[type="submit"]:disabled { opacity: .5; cursor: wait; }
    @media (max-width: 600px) { .app { height: 100dvh; } .col { max-width: 88%; } .composer { padding: 10px; } .toolbar .hint { margin-left: 0; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="avatar">AI</div>
      <div><h1>Локальный помощник</h1><div class="status">{{PROVIDER_LABEL}} · {{MODEL_LABEL}}</div></div>
    </header>
    <div class="toolbar">
      <label for="approach">Подход
        <select id="approach">
          <option value="baseline">Базовая RAG</option>
          <option value="long">LongRAG</option>
          <option value="light">LightRAG</option>
        </select>
      </label>
      <label for="mode" id="mode-field" hidden>Режим LightRAG
        <select id="mode">
          <option value="naive">naive</option>
          <option value="local">local</option>
          <option value="global">global</option>
          <option value="hybrid">hybrid</option>
          <option value="mix" selected>mix</option>
        </select>
      </label>
      <label for="tags" id="tags-field" class="check" hidden>
        <span><input id="tags" type="checkbox"> База с тегами</span>
      </label>
      <div class="hint">Модель одна: {{MODEL_LABEL}}. Меняется способ поиска.</div>
    </div>
    <section id="messages" class="messages" aria-live="polite">
      <div class="message system"><div class="bubble">Напишите сообщение, чтобы начать чат. Под ответом будет свёрнутый список только тех резюме, на которые он ссылается.</div></div>
    </section>
    <form id="chat-form" class="composer">
      <input id="message" type="text" placeholder="Сообщение" autocomplete="off" autofocus>
      <button id="send" type="submit" aria-label="Отправить">➤</button>
    </form>
  </main>
  <script>
    const form = document.querySelector('#chat-form');
    const input = document.querySelector('#message');
    const messages = document.querySelector('#messages');
    const send = document.querySelector('#send');
    const approach = document.querySelector('#approach');
    const mode = document.querySelector('#mode');
    const modeField = document.querySelector('#mode-field');
    const tags = document.querySelector('#tags');
    const tagsField = document.querySelector('#tags-field');
    function syncMode() {
      modeField.hidden = approach.value !== 'light';
      tagsField.hidden = approach.value !== 'baseline';
    }
    approach.addEventListener('change', syncMode);
    syncMode();
    function addMessage(text, role) {
      const row = document.createElement('div');
      row.className = `message ${role}`;
      const col = document.createElement('div');
      col.className = 'col';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';
      bubble.textContent = text;
      col.appendChild(bubble);
      row.appendChild(col);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
      return { row, col, bubble };
    }
    function renderSources(col, sources) {
      const items = sources && sources.used !== false ? (sources.items || []) : [];
      if (!items.length) return;
      const box = document.createElement('details');
      box.className = 'sources';
      const summary = document.createElement('summary');
      summary.textContent = 'Источники (' + items.length + ')';
      box.appendChild(summary);
      const list = document.createElement('ul');
      items.forEach((src) => {
        const item = document.createElement('li');
        const nested = document.createElement('details');
        nested.className = 'source-item';
        const title = document.createElement('summary');
        const parts = [src.id || ''];
        if (src.group_id) parts.push(src.group_id);
        if (src.snippet) parts.push(src.snippet);
        title.textContent = parts.join(' · ');
        nested.appendChild(title);
        (src.relations || []).forEach((rel) => {
          const line = document.createElement('div');
          line.className = 'muted';
          line.textContent = rel;
          nested.appendChild(line);
        });
        const body = document.createElement('div');
        body.className = 'source-full';
        body.style.whiteSpace = 'pre-wrap';
        body.textContent = src.full_text || '';
        nested.appendChild(body);
        item.appendChild(nested);
        list.appendChild(item);
      });
      box.appendChild(list);
      col.appendChild(box);
    }
    function renderCaption(col, sources, meta) {
      const label = (sources && sources.label) || (meta && meta.label) || '';
      const model = (sources && sources.model) || (meta && meta.model) || '';
      const text = [label, model].filter(Boolean).join(' · ');
      if (!text) return;
      const cap = document.createElement('div');
      cap.className = 'caption';
      cap.textContent = text;
      col.appendChild(cap);
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;
      addMessage(text, 'user');
      input.value = '';
      send.disabled = true;
      const view = addMessage('', 'assistant');
      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text, approach: approach.value, mode: mode.value, tags: approach.value === 'baseline' && tags.checked })
        });
        if (!response.ok || !response.body) throw new Error(`HTTP ${response.status}`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let sources = null;
        let dataMeta = null;
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const events = buffer.split('\n\n');
          buffer = events.pop();
          for (const eventText of events) {
            const line = eventText.split('\n').find((item) => item.startsWith('data: '));
            if (!line) continue;
            const data = JSON.parse(line.slice(6));
            if (data.error) throw new Error(data.error);
            view.bubble.textContent += data.content || '';
            if (data.sources) sources = data.sources;
            if (data.meta) dataMeta = data.meta;
            messages.scrollTop = messages.scrollHeight;
          }
        }
        renderSources(view.col, sources);
        renderCaption(view.col, sources, dataMeta);
        messages.scrollTop = messages.scrollHeight;
      } catch (error) {
        view.row.className = 'message error';
        view.bubble.textContent = `Не удалось получить ответ: ${error.message}`;
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
