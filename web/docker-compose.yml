services:
  web:
    build: .
    container_name: chat_web
    ports:
      - "8000:8000"
    environment:
      REPO_ROOT: /repo
      LLM_BACKEND: ${LLM_BACKEND:-ollama}
      # host Ollama (не docker-ollama)
      # всегда host Ollama; не брать LLM_BASE_URL с хоста (там часто localhost)
      LLM_BASE_URL: http://host.docker.internal:11434
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      LLM_MODEL: ${LLM_MODEL:-qwen3:4b-instruct}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0.45}
      LLM_TOP_P: ${LLM_TOP_P:-0.9}
      LLM_TOP_K: ${LLM_TOP_K:-40}
      LLM_MAX_TOKENS: ${LLM_MAX_TOKENS:-256}
      RAG_ENABLED: ${RAG_ENABLED:-1}
      RAG_BASE: ${RAG_BASE:-resumes_no_tags}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_DISTANCE: ${RAG_DISTANCE:-55}
      RAG_CACHE_DIR: /root/.cache/mo3_ml_hw10_rag
    volumes:
      # корень репо: labs/ML-HW10 + data для RAG
      - ..:/repo:ro
      # уже собранный FAISS-кэш с хоста
      - ${USERPROFILE}/.cache/mo3_ml_hw10_rag:/root/.cache/mo3_ml_hw10_rag
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
